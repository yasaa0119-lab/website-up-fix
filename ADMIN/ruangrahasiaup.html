<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Unit Produksi SMK Yadika 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --paper: #FCF7F8; --surface: #FFFFFF; --ink: #4A3B40; --ink-soft: #8C787D;
        --accent: #D96B84; --accent-hover: #C0556E; --accent-soft: #FCE8EE; --line: #F2DCE2;
        --status: #527A6B; --status-soft: #E4F1EC;
        --warn: #C0813A; --warn-soft: #FBEFDD;
        --danger: #C0556E; --danger-soft: #FCE8EE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
    h1, h2, .brand { font-family: 'Fraunces', serif; }

    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: var(--surface); padding: 32px 28px; border-radius: 16px; border: 1px solid var(--line); width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(217,107,132,0.08); }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 4px; color: var(--ink); }
    .login-box p { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.9rem; outline: none; background: var(--paper); }
    .input-group input:focus { border-color: var(--accent); }
    .btn-main { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .btn-main:hover { background: var(--accent-hover); }
    .login-error { color: var(--danger); font-size: 0.78rem; margin-top: 10px; min-height: 16px; }

    .app { display: none; max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .topbar h1 { font-size: 1.2rem; }
    .topbar .sub { font-size: 0.75rem; color: var(--ink-soft); }
    .btn-logout { background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
    .btn-logout:hover { border-color: var(--accent); color: var(--accent); }

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; }
    .tab-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 50px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); font-weight: 600; font-size: 0.78rem; cursor: pointer; }
    .tab-btn.active { background: var(--ink); border-color: var(--ink); color: white; }

    .order-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .order-id { font-size: 0.72rem; color: var(--ink-soft); font-weight: 600; }
    .order-time { font-size: 0.68rem; color: var(--ink-soft); }
    .badge { padding: 4px 12px; border-radius: 50px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
    .badge.Diproses { background: var(--warn-soft); color: var(--warn); }
    .badge.Lunas { background: var(--status-soft); color: var(--status); }
    .badge.Selesai { background: #E4EEF9; color: #2D6CB0; }
    .badge.Dibatalkan { background: var(--danger-soft); color: var(--danger); }

    .order-buyer { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .order-kelas { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 10px; }
    .order-note { font-size: 0.75rem; background: var(--paper); padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; color: var(--ink-soft); }
    .order-items { border-top: 1px dashed var(--line); padding-top: 10px; margin-bottom: 10px; }
    .order-item-row { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 5px; }
    .order-total { text-align: right; font-weight: 800; font-family: 'Fraunces', serif; color: var(--accent); font-size: 1rem; margin-bottom: 12px; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-row button { flex: 1; min-width: 110px; padding: 9px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
    .btn-lunas { background: var(--status-soft); color: var(--status); }
    .btn-lunas:hover { background: var(--status); color: white; }
    .btn-selesai { background: #E4EEF9; color: #2D6CB0; }
    .btn-selesai:hover { background: #2D6CB0; color: white; }
    .btn-batal { background: var(--danger-soft); color: var(--danger); }
    .btn-batal:hover { background: var(--danger); color: white; }

    .empty-state { text-align: center; color: var(--ink-soft); padding: 50px 20px; font-size: 0.85rem; font-style: italic; }
    .loading-state { text-align: center; color: var(--ink-soft); padding: 30px; font-size: 0.85rem; }

    .btn-google { width: 100%; padding: 12px; background: white; color: #4A3B40; border: 1.5px solid var(--line); border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
    .btn-google:hover { border-color: var(--accent); background: var(--accent-soft); }
    .btn-google img { width: 20px; height: 20px; }
</style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-wrap" id="loginWrap">
        <div class="login-box">
            <h1 class="brand">Admin Unit Produksi</h1>
            <p>SMK Yadika 13 — khusus penjaga UP</p>
            <button class="btn-google" onclick="doLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Masuk dengan Google
            </button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="app" id="appWrap">
        <div class="topbar">
            <div>
                <h1 class="brand">Pesanan Masuk</h1>
                <div class="sub" id="emailInfo"></div>
            </div>
            <button class="btn-logout" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-filter="Semua" onclick="setFilter('Semua')">Semua</button>
            <button class="tab-btn" data-filter="Diproses" onclick="setFilter('Diproses')">Diproses</button>
            <button class="tab-btn" data-filter="Lunas" onclick="setFilter('Lunas')">Lunas</button>
            <button class="tab-btn" data-filter="Selesai" onclick="setFilter('Selesai')">Selesai</button>
            <button class="tab-btn" data-filter="Dibatalkan" onclick="setFilter('Dibatalkan')">Dibatalkan</button>
        </div>

        <div id="orderList"><div class="loading-state">Memuat pesanan...</div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import {
            getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, orderBy, query
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4zr8ZO8dGdvuyuvQlJ9InCKoETw0haMY",
            authDomain: "unit-produksi-smkyadika13.firebaseapp.com",
            projectId: "unit-produksi-smkyadika13",
            storageBucket: "unit-produksi-smkyadika13.firebasestorage.app",
            messagingSenderId: "864805123263",
            appId: "1:864805123263:web:b6a7ad0bf856202acbc20a"
        };

        // Hanya email di bawah ini yang boleh masuk ke halaman admin
        const ALLOWED_EMAILS = ["arapmuhamad@gmail.com"];

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allOrders = [];
        let currentFilter = "Semua";
        let unsub = null;

        window.doLogin = function () {
            const errEl = document.getElementById("loginError");
            errEl.innerText = "";
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch((err) => {
                errEl.innerText = "Gagal masuk: " + err.message;
            });
        };

        window.doLogout = function () {
            if (unsub) { unsub(); unsub = null; }
            signOut(auth);
        };

        window.setFilter = function (f) {
            currentFilter = f;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
            renderOrders();
        };

        window.ubahStatus = function (idPesanan, statusBaru) {
            updateDoc(doc(db, "pesanan", idPesanan), { status: statusBaru }).catch(e => alert("Gagal update: " + e.message));
        };

        window.batalkanPesanan = function (idPesanan) {
            if (!confirm("Batalkan & hapus pesanan ini? Tidak bisa dikembalikan.")) return;
            deleteDoc(doc(db, "pesanan", idPesanan)).catch(e => alert("Gagal menghapus: " + e.message));
        };

        function formatWaktu(ts) {
            if (!ts || !ts.toDate) return "";
            return ts.toDate().toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
        }

        function renderOrders() {
            const list = document.getElementById("orderList");
            const filtered = currentFilter === "Semua" ? allOrders : allOrders.filter(o => (o.status || "Diproses") === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state">Tidak ada pesanan di kategori ini.</div>`;
                return;
            }

            list.innerHTML = filtered.map(o => {
                const status = o.status || "Diproses";
                const itemsHTML = (o.items || []).map(i =>
                    `<div class="order-item-row"><span>${i.name} (x${i.qty})</span><span>Rp ${(i.price * i.qty).toLocaleString('id-ID')}</span></div>`
                ).join("");

                let actions = "";
                if (status === "Diproses") {
                    actions = `
                        <div style="font-size:0.72rem; color:var(--ink-soft); font-style:italic; margin-bottom:8px;"><i class="fa-solid fa-clock"></i> Menunggu konfirmasi pembayaran DOKU otomatis...</div>
                        <button class="btn-batal" onclick="batalkanPesanan('${o.id}')"><i class="fa-solid fa-xmark"></i> Batalkan</button>`;
                } else if (status === "Lunas") {
                    actions = `
                        <button class="btn-selesai" onclick="ubahStatus('${o.id}', 'Selesai')"><i class="fa-solid fa-box-open"></i> Tandai Selesai</button>
                        <button class="btn-batal" onclick="batalkanPesanan('${o.id}')"><i class="fa-solid fa-xmark"></i> Batalkan</button>`;
                }

                return `
                    <div class="order-card">
                        <div class="order-top">
                            <div>
                                <div class="order-id">No. ${o.id}</div>
                                <div class="order-time">${formatWaktu(o.dibuat)}</div>
                            </div>
                            <span class="badge ${status}">${status}</span>
                        </div>
                        <div class="order-buyer">${o.nama || '-'}</div>
                        <div class="order-kelas">${o.kelas || '-'}</div>
                        ${o.catatan ? `<div class="order-note"><i class="fa-solid fa-note-sticky"></i> ${o.catatan}</div>` : ""}
                        <div class="order-items">${itemsHTML}</div>
                        <div class="order-total">Total: Rp ${(o.total || 0).toLocaleString('id-ID')}</div>
                        ${actions ? `<div class="action-row">${actions}</div>` : ""}
                    </div>
                `;
            }).join("");
        }

        function mulaiPantauPesanan() {
            const q = query(collection(db, "pesanan"), orderBy("dibuat", "desc"));
            unsub = onSnapshot(q, (snap) => {
                allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderOrders();
            }, (err) => {
                document.getElementById("orderList").innerHTML = `<div class="empty-state">Gagal memuat data: ${err.message}</div>`;
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (!ALLOWED_EMAILS.includes(user.email)) {
                    document.getElementById("loginError").innerText = `Akun ${user.email} tidak diizinkan mengakses halaman admin.`;
                    signOut(auth);
                    return;
                }
                document.getElementById("loginWrap").style.display = "none";
                document.getElementById("appWrap").style.display = "block";
                document.getElementById("emailInfo").innerText = user.email;
                mulaiPantauPesanan();
            } else {
                document.getElementById("loginWrap").style.display = "flex";
                document.getElementById("appWrap").style.display = "none";
                if (unsub) { unsub(); unsub = null; }
            }
        });
    </script>
</body>
</html>
